<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Chess</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles for the chessboard */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column; /* Changed to column for better layout with button */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a202c; /* Dark background */
            color: #e2e8f0; /* Light text */
            padding: 1rem; /* Added padding for small screens */
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px); /* 8 columns, 60px each */
            grid-template-rows: repeat(8, 60px);    /* 8 rows, 60px each */
            border: 4px solid #4a5568; /* Border around the board */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Soft shadow */
            border-radius: 8px; /* Rounded corners for the board */
            overflow: hidden; /* Ensures rounded corners apply to cells too */
            margin-bottom: 2rem; /* Space below the board */
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem; /* Increased font size for pieces */
            cursor: pointer; /* Indicate squares are interactive */
            user-select: none; /* Prevent text selection on pieces */
            transition: background-color 0.2s ease; /* Smooth transition for hover/selection */
        }

        /* Chessboard square colors */
        .light {
            background-color: #f0d9b5; /* Light square color */
        }

        .dark {
            background-color: #b58863; /* Dark square color */
        }

        /* Piece colors - Adjusted for better visibility */
        .white-piece {
            color: #ececec; /* White pieces - user requested color */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4); /* Subtle shadow for definition */
        }

        .black-piece {
            color: #333333; /* Dark color for black pieces */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.4); /* Subtle shadow for definition */
        }

        /* Styling for selected square */
        .selected-square {
            background-color: #63b3ed !important; /* Blue for selected square */
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Patch Notes Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 100; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.7); /* Black w/ opacity */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #2d3748; /* Darker background for modal */
            margin: auto;
            padding: 2rem;
            border: 1px solid #4a5568;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            max-height: 80vh; /* Limit height for scrollability */
            overflow-y: auto; /* Enable scrolling for content */
        }

        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover,
        .close-button:focus {
            color: #e2e8f0;
            text-decoration: none;
            cursor: pointer;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .chessboard {
                grid-template-columns: repeat(8, min(12vw, 50px)); /* Smaller squares on small screens */
                grid-template-rows: repeat(8, min(12vw, 50px));
            }
            .square {
                width: min(12vw, 50px);
                height: min(12vw, 50px);
                font-size: 2rem; /* Adjust piece size for smaller screens */
            }
            .modal-content {
                padding: 1rem;
                width: 95%;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-extrabold mb-8 text-blue-400">Multiplayer Chess</h1>

    <div id="chessboard-container" class="chessboard">
        <!-- Chessboard squares and pieces will be generated here by JavaScript -->
    </div>

    <button id="patchNotesBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105 mb-4">
        Patch Notes
    </button>

    <!-- Patch Notes Modal -->
    <div id="patchNotesModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 class="text-3xl font-bold mb-4 text-blue-300">Patch Notes</h2>
            <div id="patchNotesContent" class="text-gray-300">
                <!-- Patch notes will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        // JavaScript to dynamically create the chessboard squares and handle modal
        document.addEventListener('DOMContentLoaded', () => {
            const chessboardContainer = document.getElementById('chessboard-container');
            const boardSize = 8; // 8x8 board

            // --- Chess Pieces Definition (Unicode) ---
            const pieces = {
                'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', // Black pieces
                'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'  // White pieces
            };

            // --- Initial Board State (FEN-like string for simplicity) ---
            // Each character represents a piece:
            // r, n, b, q, k, p = black rook, knight, bishop, queen, king, pawn
            // R, N, B, Q, K, P = white rook, knight, bishop, queen, king, pawn
            // '1' to '8' = empty squares
            // Slashes '/' separate ranks
            const initialBoardFEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';

            // Function to parse FEN-like string into a 2D array
            function parseFEN(fen) {
                const board = [];
                const ranks = fen.split('/');
                for (let i = 0; i < ranks.length; i++) {
                    const rank = [];
                    for (let j = 0; j < ranks[i].length; j++) {
                        const char = ranks[i][j];
                        if (char >= '1' && char <= '8') {
                            // Add empty squares
                            for (let k = 0; k < parseInt(char); k++) {
                                rank.push(null); // null represents an empty square
                            }
                        } else {
                            // Add a piece
                            rank.push(char);
                        }
                    }
                    board.push(rank);
                }
                return board;
            }

            let currentBoardState = parseFEN(initialBoardFEN); // Make mutable
            let selectedPieceElement = null; // Stores the HTML element of the selected piece
            let selectedSquareId = null;     // Stores the ID of the square the piece was selected from
            let turn = 'white'; // Initial turn is white

            // Function to get row and column from a square ID (e.g., 'a1' -> {row: 7, col: 0})
            function getCoordsFromId(squareId) {
                const file = squareId.charCodeAt(0) - 97; // 'a' is 0, 'b' is 1, etc.
                const rank = 8 - parseInt(squareId[1]); // '8' is row 0, '1' is row 7
                return { row: rank, col: file };
            }

            // Function to get square ID from row and column (e.g., {row: 7, col: 0} -> 'a1')
            function getIdFromCoords(row, col) {
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                return `${file}${rank}`;
            }

            // --- Piece Validation Helper Functions ---
            function isWhitePiece(pieceCode) {
                return pieceCode && pieceCode === pieceCode.toUpperCase();
            }

            function isBlackPiece(pieceCode) {
                return pieceCode && pieceCode === pieceCode.toLowerCase();
            }

            function getPieceColor(pieceCode) {
                if (!pieceCode) return null;
                return isWhitePiece(pieceCode) ? 'white' : 'black';
            }

            // --- Piece Validation Logic ---

            function isValidPawnMove(fromRow, fromCol, toRow, toCol, pieceCode, board) {
                const pieceColor = getPieceColor(pieceCode);
                const rowDiff = toRow - fromRow;
                const colDiff = Math.abs(toCol - fromCol);

                const targetPiece = board[toRow][toCol];
                const isTargetOccupiedByEnemy = (targetPiece && getPieceColor(targetPiece) !== pieceColor);

                // Pawns cannot move horizontally or backwards (except for captures, handled below)
                if (colDiff > 1) return false;

                // White Pawn
                if (pieceColor === 'white') {
                    // Forward one square
                    if (rowDiff === -1 && colDiff === 0 && !targetPiece) {
                        return true;
                    }
                    // Forward two squares (initial move only)
                    if (fromRow === 6 && rowDiff === -2 && colDiff === 0 && !targetPiece && !board[fromRow - 1][fromCol]) {
                        return true;
                    }
                    // Capture diagonally
                    if (rowDiff === -1 && colDiff === 1 && isTargetOccupiedByEnemy) {
                        return true;
                    }
                }
                // Black Pawn
                else if (pieceColor === 'black') {
                    // Forward one square
                    if (rowDiff === 1 && colDiff === 0 && !targetPiece) {
                        return true;
                    }
                    // Forward two squares (initial move only)
                    if (fromRow === 1 && rowDiff === 2 && colDiff === 0 && !targetPiece && !board[fromRow + 1][fromCol]) {
                        return true;
                    }
                    // Capture diagonally
                    if (rowDiff === 1 && colDiff === 1 && isTargetOccupiedByEnemy) {
                        return true;
                    }
                }

                return false; // Default to invalid
            }

            function isValidRookMove(fromRow, fromCol, toRow, toCol, pieceCode, board) {
                const pieceColor = getPieceColor(pieceCode);
                const targetPiece = board[toRow][toCol];

                // Rooks move horizontally or vertically
                if (fromRow !== toRow && fromCol !== toCol) {
                    return false; // Not a straight line
                }

                // Check for blocking pieces
                if (fromRow === toRow) { // Horizontal move
                    const step = (toCol > fromCol) ? 1 : -1;
                    for (let col = fromCol + step; col !== toCol; col += step) {
                        if (board[fromRow][col]) {
                            return false; // Path is blocked
                        }
                    }
                } else { // Vertical move
                    const step = (toRow > fromRow) ? 1 : -1;
                    for (let row = fromRow + step; row !== toRow; row += step) {
                        if (board[row][fromCol]) {
                            return false; // Path is blocked
                        }
                    }
                }

                // Cannot land on a square occupied by an ally
                if (targetPiece && getPieceColor(targetPiece) === pieceColor) {
                    return false;
                }

                return true; // Valid rook move
            }


            // --- Chessboard Generation and Piece Placement ---
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    const square = document.createElement('div');
                    // Determine if the square is light or dark
                    const isLight = (row + col) % 2 === 0;
                    square.classList.add('square', isLight ? 'light' : 'dark');
                    // Add an ID for each square (e.g., 'a1', 'h8')
                    const file = String.fromCharCode(97 + col); // 'a' through 'h'
                    const rank = 8 - row; // '8' through '1'
                    square.id = `${file}${rank}`;

                    // Place piece if exists in currentBoardState
                    const pieceCode = currentBoardState[row][col];
                    if (pieceCode) {
                        const pieceElement = document.createElement('span');
                        pieceElement.classList.add('piece');
                        // Determine piece color based on case
                        if (isWhitePiece(pieceCode)) {
                            pieceElement.classList.add('white-piece');
                        } else {
                            pieceElement.classList.add('black-piece');
                        }
                        pieceElement.textContent = pieces[pieceCode];
                        square.appendChild(pieceElement);
                    }

                    // Add click event listener to each square
                    square.addEventListener('click', (event) => {
                        const clickedSquare = event.currentTarget; // The square div
                        const clickedPiece = clickedSquare.querySelector('.piece'); // The piece span inside it
                        const clickedSquareId = clickedSquare.id;
                        const clickedCoords = getCoordsFromId(clickedSquareId);
                        const pieceAtClickedSquare = currentBoardState[clickedCoords.row][clickedCoords.col];

                        if (selectedPieceElement) {
                            // A piece is already selected, now try to move it
                            const fromCoords = getCoordsFromId(selectedSquareId);
                            const pieceCodeToMove = currentBoardState[fromCoords.row][fromCoords.col];
                            const pieceColorToMove = getPieceColor(pieceCodeToMove);

                            // Check if the clicked square contains a piece of the same color (illegal move)
                            if (clickedPiece && getPieceColor(pieceAtClickedSquare) === pieceColorToMove) {
                                // If clicking on an ally piece, deselect current and select new ally piece
                                document.getElementById(selectedSquareId).classList.remove('selected-square');
                                selectedPieceElement = clickedPiece;
                                selectedSquareId = clickedSquareId;
                                clickedSquare.classList.add('selected-square');
                                return;
                            }

                            // If clicking on the same square, deselect
                            if (selectedSquareId === clickedSquareId) {
                                document.getElementById(selectedSquareId).classList.remove('selected-square');
                                selectedPieceElement = null;
                                selectedSquareId = null;
                                return;
                            }

                            // --- Move Validation Check ---
                            let isValidMove = false;
                            const pieceType = pieceCodeToMove.toLowerCase();

                            if (pieceType === 'p') { // Pawn
                                isValidMove = isValidPawnMove(fromCoords.row, fromCoords.col, clickedCoords.row, clickedCoords.col, pieceCodeToMove, currentBoardState);
                            } else if (pieceType === 'r') { // Rook
                                // FIX: Corrected fromCol.col to fromCoords.col
                                isValidMove = isValidRookMove(fromCoords.row, fromCoords.col, clickedCoords.row, clickedCoords.col, pieceCodeToMove, currentBoardState);
                            }
                            else {
                                // For other pieces, allow any move for now (will be validated later)
                                isValidMove = true;
                            }


                            if (isValidMove) {
                                // If there's a piece at the target square, remove it (capture)
                                if (clickedPiece) {
                                    clickedPiece.remove();
                                }

                                // Move the piece visually
                                clickedSquare.appendChild(selectedPieceElement);

                                // Update the internal board state
                                currentBoardState[fromCoords.row][fromCoords.col] = null; // Clear old position
                                currentBoardState[clickedCoords.row][clickedCoords.col] = pieceCodeToMove; // Set new position

                                // Deselect the piece
                                document.getElementById(selectedSquareId).classList.remove('selected-square');
                                selectedPieceElement = null;
                                selectedSquareId = null;

                                // Switch turn after a valid move
                                turn = (turn === 'white') ? 'black' : 'white';
                                console.log(`Current turn: ${turn}`); // For debugging
                            } else {
                                // Invalid move: deselect the piece and give feedback (optional for now)
                                console.log("Invalid move for this piece.");
                                document.getElementById(selectedSquareId).classList.remove('selected-square');
                                selectedPieceElement = null;
                                selectedSquareId = null;
                            }

                        } else {
                            // No piece is selected, try to select one
                            if (clickedPiece) {
                                // Ensure only pieces of the current turn's color can be selected
                                const pieceColor = getPieceColor(pieceAtClickedSquare);
                                if (pieceColor === turn) {
                                    selectedPieceElement = clickedPiece;
                                    selectedSquareId = clickedSquareId;
                                    clickedSquare.classList.add('selected-square');
                                } else {
                                    console.log(`It's ${turn}'s turn. Cannot select opponent's piece.`);
                                    // Optional: Add a visual indicator or message to the user here
                                }
                            }
                        }
                    });

                    chessboardContainer.appendChild(square);
                }
            }

            // --- Patch Notes Modal Logic ---
            const patchNotesBtn = document.getElementById('patchNotesBtn');
            const patchNotesModal = document.getElementById('patchNotesModal');
            const closeButton = patchNotesModal.querySelector('.close-button');
            const patchNotesContent = document.getElementById('patchNotesContent');

            // Define patch notes content
            const patchNotes = `
                <h3 class="text-xl font-semibold mb-2">Version 0.1.8 - Rook Move Validation Fix</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>**Bug Fix:** Corrected a typo in the call to <code>isValidRookMove</code> where <code>fromCol.col</code> was incorrectly used instead of <code>fromCoords.col</code>. This resolves the issue where rooks could not move correctly even if their path was clear.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.7 - Rook Move Validation</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Implemented <code>isValidRookMove</code> function to validate rook moves:
                        <ul class="list-circle list-inside ml-4">
                            <li>Allows movement any number of squares horizontally or vertically.</li>
                            <li>Checks for and prevents moves through blocking pieces.</li>
                            <li>Prevents landing on a square occupied by an ally piece.</li>
                        </ul>
                    </li>
                    <li>Integrated rook move validation into the main click handler.</li>
                    <li>Added a general <code>getPieceColor</code> helper function.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.6 - Pawn Move Validation & Turns</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Introduced a <code>turn</code> variable (initially 'white') to manage whose turn it is.</li>
                    <li>Implemented a <code>isValidPawnMove</code> function to validate pawn moves according to basic chess rules:
                        <ul class="list-circle list-inside ml-4">
                            <li>Forward one square to an empty square.</li>
                            <li>Forward two squares from the starting rank (only if both squares are empty).</li>
                            <li>Diagonal capture (forward one, sideways one) if an opponent's piece is present.</li>
                            <li>Prevents moving backwards or horizontally for non-captures.</li>
                            <li>Prevents moving onto a square occupied by an ally.</li>
                        </ul>
                    </li>
                    <li>Modified the click handler to:
                        <ul class="list-circle list-inside ml-4">
                            <li>Only allow selection of pieces belonging to the current turn's color.</li>
                            <li>Validate pawn moves using <code>isValidPawnMove</code> before executing.</li>
                            <li>Automatically switch turns after a valid move.</li>
                            <li>Handle basic captures by removing the captured piece from the DOM and board state.</li>
                            <li>Deselect piece if an invalid move is attempted.</li>
                        </ul>
                    </li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.5 - Basic Piece Movement</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Implemented basic piece selection: clicking a piece highlights its square.</li>
                    <li>Implemented basic piece movement: clicking an empty square after selecting a piece moves the piece to that square.</li>
                    <li>Updated the internal <code>currentBoardState</code> array to reflect visual moves.</li>
                    <li>Added a <code>.selected-square</code> CSS class for visual feedback on selected squares.</li>
                    <li>Added helper functions <code>getCoordsFromId</code> and <code>getIdFromCoords</code> for easier coordinate mapping.</li>
                    <li>**Note:** This version does NOT include any chess rule validation. Pieces can move anywhere.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.4 - White Piece Color Update</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Updated the color of white chess pieces to <code>#ececec</code> as requested for better visibility.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.3 - Improved Piece Visibility (Previous)</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Adjusted the color of white chess pieces to a darker shade (<code>#333333</code>) for significantly improved contrast and visibility on light squares.</li>
                    <li>Ensured both white and black pieces use the same dark color for consistent readability across the board.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.2 - Pieces on Board</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Integrated Unicode chess symbols for all pieces (pawns, rooks, knights, bishops, queens, kings).</li>
                    <li>Implemented a function to parse a FEN-like string to represent the initial board state.</li>
                    <li>Dynamically placed all chess pieces on their correct starting squares.</li>
                    <li>Added basic styling to differentiate white and black pieces.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.1 - Patch Notes Integration</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Added a "Patch Notes" button to the main screen.</li>
                    <li>Implemented a modal window to display patch notes.</li>
                    <li>Initial patch notes content is now displayed within the app.</li>
                </ul>
                <h3 class="text-xl font-semibold mt-4 mb-2">Version 0.1.0 - Initial Board Setup</h3>
                <ul class="list-disc list-inside ml-4">
                    <li>Created the basic HTML structure for the game.</li>
                    <li>Implemented a dynamically generated 8x8 chessboard using JavaScript.</li>
                    <li>Applied basic CSS with Tailwind CSS for a visually appealing board with alternating light and dark squares, rounded corners, and responsive adjustments.</li>
                    <li>Added unique IDs to each square (e.g., 'a1', 'h8') for easier referencing in future game logic.</li>
                </ul>
            `;

            // Set the content of the patch notes modal
            patchNotesContent.innerHTML = patchNotes;

            // Show modal when button is clicked
            patchNotesBtn.addEventListener('click', () => {
                patchNotesModal.style.display = 'flex'; // Use flex to center content
            });

            // Hide modal when close button is clicked
            closeButton.addEventListener('click', () => {
                patchNotesModal.style.display = 'none';
            });

            // Hide modal when clicking outside of the modal content
            window.addEventListener('click', (event) => {
                if (event.target === patchNotesModal) {
                    patchNotesModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
